[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nexus-proof-runtime"
version = "0.1.1"
description = "A receipt-backed execution and artifact-evidence layer for LLM tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Christopher Campbell" }]
keywords = ["llm", "tools", "receipts", "artifacts", "authorization", "ai-safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.9,<1"]

[project.scripts]
nexus-proof-demo = "nexus_proof_runtime.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_proof_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

